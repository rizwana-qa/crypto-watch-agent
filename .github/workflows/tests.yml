name: Tests

# A push that changes the code or the playbook runs the offline tests. The scenario tests with the real AI run only when started by hand.
on:
  push:
    paths:
      - "agent.py"
      - "sources.py"
      - "scenarios.py"
      - "report.py"
      - "emailbody.py"
      - "asktab.py"
      - "rag_static.js"
      - "rag_tab.js"
      - "start_ask_page.bat"
      - "insights.py"
      - "rag.py"
      - "rag_server.py"
      - "rag_ui.html"
      - "export_data.py"
      - "features.py"
      - "validate_data.py"
      - "playbook.md"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "Version to test with the real AI: agent (tool loop) or planner (plan, check, run, decide)"
        type: choice
        options: [agent, planner]
        default: agent
      reviewer:
        description: "AI review of a drafted alert (one small extra AI call, only on scenarios that draft an alert; the code review always runs)"
        type: choice
        options: ["on", "off"]
        default: "on"
      only:
        description: "Which scenarios to run, for example 10,14,11 or 1,3,5. A scenario costs about 23K tokens with the six tools (14K calm, up to 30K with an alert), and the free Groq cap is 200K a day, so run about six a day (see the README, Token budget)"
        type: string
        default: "10,14,11,3,8,12"
      publish:
        description: "Also write every scenario result to the scenarios tab of the Google Sheet (needs the Code.gs update deployed)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tests:
    name: Guardrail tests and scenario tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      # No AI, no network: a scripted AI proves the guardrails and the control flow.
      - name: Guardrail tests (offline)
        run: python tests/test_guardrails.py -v

      - name: Context tests (offline)
        run: python tests/test_context.py -v

      - name: Report tests (offline)
        run: python tests/test_report.py -v

      - name: Email body tests (offline)
        run: python tests/test_emailbody.py -v

      - name: Insights tests (offline)
        run: python tests/test_insights.py -v

      - name: Ask page tests (retrieval, answer guardrails, local server) (offline)
        run: python tests/test_rag.py -v

      - name: Ask tab tests (the browser engine must answer exactly like rag.py) (offline)
        run: python tests/test_asktab.py -v

      - name: Sources tests (offline)
        run: python tests/test_sources.py -v

      - name: Export tests (offline)
        run: python tests/test_export.py -v

      - name: Data validation tests (offline)
        run: python tests/test_validate.py -v

      - name: Fetch-data scenario tests (offline)
        run: python tests/test_fetch_data.py -v

      - name: Market feature tests (offline)
        run: python tests/test_features.py -v

      # Regression tests for the production-readiness fixes (D-01 to D-20). test_fix_d10.py runs tests/test_codegs_idempotency.js with node.
      - name: Production-readiness fix tests (offline)
        run: python -m unittest discover -s tests -p "test_fix_*.py" -v

      # Fake market data and fake history, real AI. A failed scenario exits with code 1, so this step turns red.
      # It runs ONLY when you start the workflow by hand (Actions > Tests > Run workflow). A push runs the offline tests above and nothing
      # else, because scenarios with the real AI cost about 23K tokens each and the free Groq cap is 200K tokens a day: a push used to
      # take most of the allowance the daily run needs. When you run it by hand you pick the version, the scenarios (default 10,14,11,3,8,12,
      # about 130K tokens) and whether to publish the results.
      - name: Scenario tests (fake tools, real AI), manual runs only
        if: github.event_name == 'workflow_dispatch'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SHEET_URL: ${{ inputs.publish && secrets.SHEET_URL || '' }}
          SCENARIO_PAUSE: "3"
          MODE: ${{ inputs.mode }}
          REVIEWER: ${{ inputs.reviewer }}
          ONLY: ${{ inputs.only }}
          PUBLISH: ${{ inputs.publish && 'yes' || 'no' }}
        run: |
          flags=()
          if [ "${PUBLISH}" = "yes" ]; then flags+=(--publish); fi
          python agent.py --test --mode "${MODE:-agent}" --reviewer "${REVIEWER:-on}" --only "${ONLY}" "${flags[@]}"

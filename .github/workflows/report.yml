name: Executive report

# Builds the executive intelligence brief right after the daily run, whether it passed or failed, and emails it: one email per day, with a
# subject written from the day's numbers. A failed daily run (for example no Kraken data for any coin) still gets its email, which then says
# the data is unavailable. A cancelled or skipped daily run does not start it. The email body is the brief itself, and the interactive page
# is attached.
# The last step checks the Ask page's playbook index. The Ask page itself runs on your own computer (start_ask_page.bat), so your
# Groq key never leaves it.
# It can also be started by hand from the Actions tab.
on:
  workflow_run:
    workflows: ["Daily crypto watch"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: executive-report
  cancel-in-progress: false

jobs:
  report:
    name: Build the brief and email it
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      # No AI call here: the analysis text is the agent's own latest decision, read from the Sheet.
      - name: Build the brief and email it
        env:
          SHEET_URL: ${{ secrets.SHEET_URL }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}   # optional and free (Demo key)
          # Optional repository variables (Settings > Secrets and variables > Actions > Variables). When one is set to an https address,
          # the email shows a button for it. When it is empty, the email says plainly what to open instead of showing a link that cannot work.
          REPORT_URL: ${{ vars.REPORT_URL }}
          ASK_URL: ${{ vars.ASK_URL }}
        run: python report.py --out executive-report.html --email

      # The playbook is searched by the Ask page (python rag_server.py). This step proves the index still finds the right section for
      # every test question after today's code. No AI call and no key.
      - name: Check the Ask page's playbook index (no AI call)
        if: ${{ !cancelled() }}
        run: python rag.py --check
